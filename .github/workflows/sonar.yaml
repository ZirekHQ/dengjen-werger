name: Sonar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# SonarCloud keeps whichever report finishes processing last, not the newest
# commit, so overlapping scans can leave main showing an older analysis.
concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: Sonar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Fork PRs are never given repository secrets, so SONAR_TOKEN would be empty
    # and the scan would fail with a red X the contributor cannot clear.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Sonar needs full history for new-code detection and blame
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Generate a throwaway database password
        run: echo "DB_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - run: docker compose up -d --build --wait
      # integrationTest feeds the SQL repositories into the coverage report.
      - run: ./gradlew test integrationTest jacocoTestReport
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: werger
          DB_NAME: werger

      - name: SonarQube scan
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3
