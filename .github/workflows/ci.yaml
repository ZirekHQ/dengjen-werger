name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      # check = unit tests + 80% JaCoCo line-coverage gate + Spotless.
      - run: ./gradlew check
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      # Fork PRs get no secrets, so run a local database.
      - run: docker compose up -d --build --wait
      - run: ./gradlew integrationTest
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: werger
          DB_PASSWORD: werger
          DB_NAME: werger
