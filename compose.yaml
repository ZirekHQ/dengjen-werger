services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: ${DB_USER:-werger}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-werger}
      POSTGRES_DB: ${DB_NAME:-werger}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
