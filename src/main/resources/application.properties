spring.application.name=dengjen-werger
server.port=8080
spring.threads.virtual.enabled=true
werger.auth.supabase-url=${SUPABASE_URL}
werger.auth.supabase-publishable-key=${SUPABASE_PUBLISHABLE_KEY}
werger.speech.grpc-target=${DENGJEN_GRPC_TARGET:localhost:49314}
werger.speech.voice-config=${DENGJEN_VOICE_CONFIG:}
werger.speech.deadline=${DENGJEN_GRPC_DEADLINE:30s}
