sonar.projectKey=ZirekHQ_dengjen-werger
sonar.organization=zirekhq

# sonar.sources/sonar.tests fail hard on a configured path that doesn't
# exist, so this scopes from the repo root with exclusions instead of
# naming src/ paths that aren't guaranteed to exist on every commit.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/src/test/**,**/src/it/**,**/src/e2e/**
sonar.exclusions=build/**,.gradle/**,client/node_modules/**,client/dist/**,docs/**
sonar.sourceEncoding=UTF-8
sonar.java.source=25
sonar.java.binaries=build/classes/java/main
sonar.java.test.binaries=build/classes/java/test
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
