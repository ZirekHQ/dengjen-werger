sonar.projectKey=ZirekHQ_dengjen-werger
sonar.organization=zirekhq

# src/{main,test}/scala don't exist on every commit this scans (this repo
# is mid-build-out) -- sonar.sources/sonar.tests fail hard on a configured
# path that's missing, so scope from the repo root with exclusions instead
# of naming paths that have to exist.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/src/test/**
sonar.exclusions=target/**,project/target/**,project/project/**,client/node_modules/**,client/dist/**,docs/**
sonar.sourceEncoding=UTF-8
