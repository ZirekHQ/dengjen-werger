sonar.projectKey=ZirekHQ_dengjen-werger
sonar.organization=zirekhq

# sonar.sources/sonar.tests fail hard on a configured path that doesn't
# exist, so this scopes from the repo root with exclusions instead of
# naming src/ paths that aren't guaranteed to exist on every commit.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/src/test/**,**/src/it/**,**/src/e2e/**
sonar.exclusions=target/**,project/target/**,project/project/**,client/node_modules/**,client/dist/**,docs/**
sonar.sourceEncoding=UTF-8
sonar.scala.coverage.reportPaths=target/scala-3.9.0/scoverage-report/scoverage.xml
