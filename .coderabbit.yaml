reviews:
  path_filters:
    - "!target/**"
    - "!project/target/**"
    - "!project/project/**"
    - "!.idea/**"

  instructions: |
    - This is a Scala 3 / Cats Effect / http4s backend (see build.sbt); no client/frontend exists yet.
    - Follow this org's Scala conventions: no `var`, `null`, or `return`; prefer `map`/`fold` over loops; errors as `Either`/`IO`, never thrown exceptions for expected failures.
    - Database access goes through Skunk, not JDBC — flag any JDBC/HikariCP dependency or import, since JDBC's reflection-heavy driver registration breaks the project's planned GraalVM native-image build.
    - The project's core value proposition is that a live translation was actually reviewed — flag any change that could let a submission reach a synced/upstream-pushed state without a completed, valid review, or that could let a user review their own submission.
    - Concurrency-sensitive paths (work-item leasing, the review state transition, points-ledger payout) need tests that exercise the race, not just the happy path — flag such changes when they lack one.
    - Keep comments concise: explain the root cause and the fix, not a restatement of the code.

  path_instructions:
    - path: "src/main/scala/werger/http/**"
      instructions: |
        - Routes should stay thin: request/response mapping and status codes only, with domain and business logic living elsewhere as the domain model grows.

    - path: "src/test/scala/**"
      instructions: |
        - Prefer munit-cats-effect's IO-native assertions over blocking/unsafeRunSync calls in test bodies.
